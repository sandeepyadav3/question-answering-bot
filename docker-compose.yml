services:
  document-qa:
    build: .
    image: document-qa
    container_name: document-qa
    # Bind to loopback only. Saved documents require a tenant bearer token.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CHROMA_PERSIST_DIR: /data
      TENANT_TOKENS: '{"acme":"acme-demo-token","northwind":"northwind-demo-token"}'
    volumes:
      - document-data:/data
    # Copy .env.example to .env and set OPENAI_API_KEY there. Never commit a real key.
    env_file:
      - .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  document-data:
