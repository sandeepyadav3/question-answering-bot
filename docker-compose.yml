services:
  document-qa:
    build: .
    image: document-qa
    container_name: document-qa
    # Bind to loopback only; the service has no authentication.
    ports:
      - "127.0.0.1:8000:8000"
    # Copy .env.example to .env and set OPENAI_API_KEY there. Never commit a real key.
    env_file:
      - .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g
