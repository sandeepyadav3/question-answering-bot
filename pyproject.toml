[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "document-qa"
version = "0.1.0"
description = "Request-scoped document question answering service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
  "pypdf>=6.19,<7",
  "tiktoken>=0.14,<1",
  "langchain-text-splitters>=1.1,<2",
  "chromadb==1.0.20",
  "openai>=2.54,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.tiktoken", "static/*.html", "static/*.css", "static/*.js", "static/examples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
